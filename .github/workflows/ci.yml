---
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (zizmor unpinned-uses); tag noted.
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The external Carbide corpus is not in the repo, so corpus-dependent
      # tests SKIP cleanly (see tests/corpus.ts). Unit/fidelity tests still
      # run; set BUILDIT_CORPUS + restore fixtures to exercise the rest.
      - run: npm test
